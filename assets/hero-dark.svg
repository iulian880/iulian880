<svg xmlns="http://www.w3.org/2000/svg" width="900" height="272" viewBox="0 0 900 272" role="img" aria-label="Iulian Petcu — Software Engineer, Automation, Fintech and AI Tooling">
  <defs>
    <radialGradient id="glowDark" cx="88%" cy="14%" r="58%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#0EA5E9" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentBarDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <pattern id="dotGridDark" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363D" opacity="0.65" />
    </pattern>
    <clipPath id="cardClipDark">
      <rect x="1" y="1" width="898" height="270" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClipDark)">
    <!-- Base Surface -->
    <rect x="0" y="0" width="900" height="272" fill="#0D1117" />
    <rect x="0" y="0" width="900" height="272" fill="url(#glowDark)" />

    <!-- Subtle Architectural Dot Grid (Top-Right) -->
    <rect x="540" y="12" width="348" height="156" fill="url(#dotGridDark)" opacity="0.55" />

    <!-- Top Edge Hairline Accent -->
    <rect x="0" y="0" width="420" height="2.5" fill="url(#accentBarDark)" />

    <!-- Eyebrow Location -->
    <text x="40" y="39" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" letter-spacing="1.1">TIMIȘOARA, RO  ·  OPEN TO REMOTE (EU)</text>

    <!-- Status Pill -->
    <rect x="614" y="21" width="246" height="26" rx="13" fill="#0D2624" stroke="#1E5B54" stroke-width="1" />
    <circle cx="633" cy="34" r="4" fill="#2DD4BF" />
    <text x="646" y="38" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.4">SEEKING FULL-TIME ENGINEERING</text>

    <!-- Display Name -->
    <text x="40" y="92" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.8">Iulian Petcu</text>

    <!-- Role Subtitle -->
    <text x="40" y="122" fill="#2DD4BF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="-0.1">Software Engineer — Automation, Fintech &amp; AI Tooling</text>

    <!-- Credibility Summary Line -->
    <text x="40" y="149" fill="#9BA7B4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400">B.Sc. Applied CS  ·  5+ yrs Financial Accountant → Software Engineer  ·  Freelancer seeking long-term full-time stability</text>

    <!-- Horizontal Divider -->
    <line x1="40" y1="176" x2="860" y2="176" stroke="#21262D" stroke-width="1" />

    <!-- KPI 1 -->
    <text x="40" y="216" fill="#2DD4BF" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="700" letter-spacing="-0.5">1,000+ hrs/yr</text>
    <text x="40" y="239" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Saved via internal automation</text>

    <line x1="258" y1="194" x2="258" y2="248" stroke="#21262D" stroke-width="1" />

    <!-- KPI 2 -->
    <text x="276" y="216" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="700" letter-spacing="-0.5">1,141+ Tests</text>
    <text x="276" y="239" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Public CI + 20 ERP test suites</text>

    <line x1="482" y1="194" x2="482" y2="248" stroke="#21262D" stroke-width="1" />

    <!-- KPI 3 -->
    <text x="500" y="216" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="700" letter-spacing="-0.5">7 Systems</text>
    <text x="500" y="239" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">ERP · Fintech · AI · WPF · Web</text>

    <line x1="686" y1="194" x2="686" y2="248" stroke="#21262D" stroke-width="1" />

    <!-- KPI 4 -->
    <text x="704" y="216" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="700" letter-spacing="-0.5">CS + 5y Fin.</text>
    <text x="704" y="239" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Accountant → Software Eng.</text>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="1" y="1" width="898" height="270" rx="14" fill="none" stroke="#30363D" stroke-width="1" />
</svg>
