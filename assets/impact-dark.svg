<svg xmlns="http://www.w3.org/2000/svg" width="900" height="184" viewBox="0 0 900 184" role="img" aria-label="Enterprise Automation Architecture — 1,000+ hours saved annually">
  <defs>
    <clipPath id="impClipDark">
      <rect x="1" y="1" width="898" height="182" rx="12" />
    </clipPath>
  </defs>

  <g clip-path="url(#impClipDark)">
    <rect x="0" y="0" width="900" height="184" fill="#0D1117" />

    <!-- Header Strip -->
    <text x="24" y="30" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.0">ENTERPRISE AUTOMATION ARCHITECTURE  ·  PRODUCTION DEPLOYMENT IN LOCKED-DOWN CORPORATE ENVIRONMENTS</text>

    <!-- Node 1: Constraints -->
    <rect x="24" y="46" width="194" height="114" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="40" y="69" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="0.8">01 · CONSTRAINTS</text>
    <text x="40" y="92" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Zero-Install Reality</text>
    <text x="40" y="112" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">· No admin or RPA licenses</text>
    <text x="40" y="129" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">· SAP Scripting disabled</text>
    <text x="40" y="146" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">· Zero stored credentials</text>

    <!-- Arrow 1 -->
    <line x1="222" y1="103" x2="240" y2="103" stroke="#484F58" stroke-width="1.5" />
    <polygon points="239,99 246,103 239,107" fill="#484F58" />

    <!-- Node 2: Runtime Engine -->
    <rect x="248" y="46" width="204" height="114" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="264" y="69" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="0.8">02 · RUNTIME ENGINE</text>
    <text x="264" y="92" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Declarative Automation</text>
    <text x="264" y="112" fill="#9BA7B4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">· Win32 API · Focus-safe UI</text>
    <text x="264" y="129" fill="#9BA7B4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">· Edge CDP + Shadow DOM</text>
    <text x="264" y="146" fill="#9BA7B4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">· Embedded Python PDF</text>

    <!-- Arrow 2 -->
    <line x1="456" y1="103" x2="474" y2="103" stroke="#484F58" stroke-width="1.5" />
    <polygon points="473,99 480,103 473,107" fill="#484F58" />

    <!-- Node 3: Build & CI -->
    <rect x="482" y="46" width="198" height="114" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="498" y="69" fill="#A78BFA" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="0.8">03 · BUILD &amp; QA</text>
    <text x="498" y="92" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Zero-Excel CI Pipeline</text>
    <text x="498" y="112" fill="#9BA7B4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">· Pure-Python MS-OVBA/CFB</text>
    <text x="498" y="129" fill="#9BA7B4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">· Custom static VBA linter</text>
    <text x="498" y="146" fill="#9BA7B4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">· 20+ headless test suites</text>

    <!-- Arrow 3 -->
    <line x1="684" y1="103" x2="702" y2="103" stroke="#2DD4BF" stroke-width="1.5" />
    <polygon points="701,99 708,103 701,107" fill="#2DD4BF" />

    <!-- Node 4: Measured Outcome -->
    <rect x="710" y="46" width="166" height="114" rx="10" fill="#0D2624" stroke="#1E5B54" stroke-width="1.2" />
    <text x="726" y="69" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="0.8">04 · OUTCOME</text>
    <text x="726" y="102" fill="#2DD4BF" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="700" letter-spacing="-0.6">1,000+ hrs</text>
    <text x="726" y="123" fill="#CCFBF1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500">saved every year</text>
    <text x="726" y="144" fill="#99F6E4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" opacity="0.85">Multi-ERP O2C &amp; finance</text>
  </g>

  <rect x="1" y="1" width="898" height="182" rx="12" fill="none" stroke="#30363D" stroke-width="1" />
</svg>
